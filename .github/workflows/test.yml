name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx next typegen  # generates .next/types used by page props
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # keep in sync with the supabase devDependency so gen types output matches
          version: 2.121.0
      - run: supabase start
      - run: supabase test db
      # Regenerate the checked-in types; fails if a migration drifted
      - run: supabase gen types typescript --local > utils/database.types.ts
      - run: git diff --exit-code utils/database.types.ts
